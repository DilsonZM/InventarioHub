<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Restablecer contraseña · Corner House</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'DM Sans', sans-serif; }
    .brand-gradient { background: linear-gradient(160deg, #052b1d 0%, #073626 45%, #0a5a3f 100%); }
    .card { background: rgba(15, 23, 42, 0.55); border: 1px solid rgba(255,255,255,0.08); backdrop-filter: blur(14px); }
    input { color-scheme: dark; }
  </style>
</head>
<body class="brand-gradient min-h-[100dvh] flex items-center justify-center p-4">
  <div class="card rounded-3xl w-full max-w-md p-8 shadow-2xl">
    <div class="text-center mb-6">
      <h1 class="text-2xl font-bold text-white tracking-wide" style="font-family:'Space Mono',monospace">CORNER HOUSE</h1>
      <p class="text-slate-400 text-sm mt-1">Restablecer contraseña</p>
    </div>

    <!-- Estado: enlace inválido -->
    <div id="invalidBox" class="hidden p-4 bg-red-500/10 border border-red-500/20 rounded-2xl">
      <p class="text-sm text-red-300 text-center" id="invalidMsg">El enlace es inválido o expiró.</p>
      <a href="/views/login.html" class="block text-center mt-3 text-sm font-semibold text-warm-300 hover:text-warm-200">Volver a iniciar sesión</a>
    </div>

    <!-- Formulario -->
    <form id="resetForm" class="hidden space-y-4">
      <p class="text-slate-300 text-sm leading-6">
        Elegí tu nueva contraseña. Debe tener al menos 6 caracteres.
      </p>
      <div>
        <label for="newPassword" class="block text-sm font-medium text-slate-200 mb-1.5">Nueva contraseña *</label>
        <input type="password" id="newPassword" minlength="6" required autocomplete="new-password"
          class="w-full px-4 py-3 bg-slate-900/60 border border-white/10 rounded-2xl text-sm text-white placeholder-slate-500 focus:outline-none focus:border-brand-400 transition-all">
      </div>
      <div>
        <label for="confirmPassword" class="block text-sm font-medium text-slate-200 mb-1.5">Repetir contraseña *</label>
        <input type="password" id="confirmPassword" minlength="6" required autocomplete="new-password"
          class="w-full px-4 py-3 bg-slate-900/60 border border-white/10 rounded-2xl text-sm text-white placeholder-slate-500 focus:outline-none focus:border-brand-400 transition-all">
      </div>
      <div id="resetError" class="hidden p-3 bg-red-500/10 border border-red-500/20 rounded-2xl">
        <p class="text-sm text-red-300 text-center"></p>
      </div>
      <div id="resetSuccess" class="hidden p-3 bg-emerald-500/10 border border-emerald-400/20 rounded-2xl">
        <p class="text-sm text-emerald-300 text-center"></p>
      </div>
      <button type="submit" id="resetBtn"
        class="w-full py-3 px-4 text-sm font-semibold rounded-2xl text-white bg-brand-600 hover:bg-brand-500 disabled:opacity-50 disabled:cursor-not-allowed transition-all">
        Guardar nueva contraseña
      </button>
    </form>
  </div>

  <script src="../js/api.js"></script>
  <script>
    (function () {
      function show(el, msg) {
        var box = document.getElementById(el);
        box.classList.remove('hidden');
        if (msg) box.querySelector('p').textContent = msg;
      }

      function getHashParams() {
        var out = {};
        var hash = String(location.hash || '').replace(/^#/, '');
        hash.split('&').forEach(function (pair) {
          if (!pair) return;
          var idx = pair.indexOf('=');
          var k = decodeURIComponent(pair.slice(0, idx));
          var v = decodeURIComponent(pair.slice(idx + 1));
          out[k] = v;
        });
        return out;
      }

      var params = getHashParams();
      var accessToken = params.access_token || '';
      var isRecovery = (params.type || '') === 'recovery';

      if (!accessToken || !isRecovery) {
        show('invalidBox', params.error_description
          ? decodeURIComponent(params.error_description)
          : 'El enlace es inválido o expiró. Solicitá uno nuevo desde el login.');
        return;
      }

      document.getElementById('resetForm').classList.remove('hidden');

      document.getElementById('resetForm').addEventListener('submit', async function (e) {
        e.preventDefault();
        var pass = document.getElementById('newPassword').value;
        var confirm = document.getElementById('confirmPassword').value;
        var btn = document.getElementById('resetBtn');

        if (pass.length < 6) { show('resetError', 'La contraseña debe tener al menos 6 caracteres'); return; }
        if (pass !== confirm) { show('resetError', 'Las contraseñas no coinciden'); return; }

        btn.disabled = true;
        btn.textContent = 'Guardando...';
        try {
          var res = await API.auth.resetPassword(accessToken, pass);
          show('resetSuccess', (res.data && res.data.message) || 'Contraseña actualizada.');
          document.getElementById('resetError').classList.add('hidden');
          // Limpiar tokens de la URL
          history.replaceState(null, '', location.pathname);
          setTimeout(function () { window.location.href = '/views/login.html'; }, 2500);
        } catch (err) {
          show('resetError', err.message || 'No se pudo actualizar la contraseña');
          btn.disabled = false;
          btn.textContent = 'Guardar nueva contraseña';
        }
      });
    })();
  </script>
</body>
</html>
