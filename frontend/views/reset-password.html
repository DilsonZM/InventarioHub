<!DOCTYPE html>
<html lang="es" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#040907">
  <meta name="apple-mobile-web-app-title" content="Corner House">
  <title>Restablecer contraseña · Corner House</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <script src="../js/tailwind-config.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'DM Sans', system-ui, -apple-system, sans-serif; }
    input { color-scheme: dark; }
  </style>
</head>
<body class="min-h-[100dvh] bg-gradient-to-b from-[#0b1e17] via-[#091510] to-[#040907] flex items-center justify-center p-4 antialiased relative overflow-x-hidden">

  <!-- Glows decorativos -->
  <div class="pointer-events-none absolute -top-24 left-1/2 -translate-x-1/2 w-80 h-80 bg-emerald-500/10 rounded-full blur-3xl"></div>
  <div class="pointer-events-none absolute bottom-0 right-0 w-72 h-72 bg-brand-500/10 rounded-full blur-3xl"></div>

  <!-- Tarjeta central -->
  <div class="max-w-md w-full mx-auto p-8 rounded-2xl bg-slate-900/80 border border-emerald-900/40 shadow-2xl backdrop-blur-sm relative z-10">

    <!-- Encabezado -->
    <div class="flex flex-col items-center text-center mb-6">
      <div class="inline-flex items-center gap-2.5 mb-4">
        <span class="w-10 h-10 rounded-xl bg-emerald-600/15 border border-emerald-500/30 flex items-center justify-center">
          <svg class="w-5 h-5 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M3 10.5L12 3l9 7.5M5.25 9.75V20.25h13.5V9.75M9.75 20.25v-5.25h4.5v5.25"/>
          </svg>
        </span>
        <span class="text-lg font-bold tracking-tight text-white" style="font-family:'Space Mono',monospace">Corner House</span>
      </div>
      <h1 class="text-2xl font-bold text-white tracking-tight">Restablece tu contraseña</h1>
      <p class="text-sm text-slate-400 mt-1 mb-6">Ingresa tu nueva clave de acceso para continuar.</p>
    </div>

    <!-- Estado: enlace inválido -->
    <div id="invalidBox" class="hidden">
      <div class="p-4 bg-rose-500/10 border border-rose-500/20 rounded-xl">
        <p class="text-sm text-rose-300 text-center" id="invalidMsg">El enlace es inválido o expiró.</p>
      </div>
      <a href="/views/login.html" class="w-full mt-6 py-3 px-4 bg-emerald-600 hover:bg-emerald-500 text-white font-semibold rounded-xl shadow-lg shadow-emerald-900/30 transition-all text-sm flex items-center justify-center gap-2">
        Volver a iniciar sesión
      </a>
    </div>

    <!-- Formulario -->
    <form id="resetForm" class="hidden space-y-5" novalidate>
      <div>
        <label for="newPassword" class="text-xs font-medium text-slate-300 mb-1.5 block">Nueva contraseña</label>
        <input
          type="password"
          id="newPassword"
          autocomplete="new-password"
          placeholder="Escribe tu nueva contraseña"
          class="w-full px-4 py-3 bg-slate-950/60 border border-slate-700/80 rounded-xl text-white placeholder-slate-500 focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 transition-all text-sm"
        >
        <ul class="mt-2 space-y-1">
          <li id="reqLength" class="text-xs text-slate-500 flex items-center gap-1.5">
            <span class="req-icon" aria-hidden="true">○</span>
            <span>Al menos 6 caracteres</span>
          </li>
        </ul>
      </div>

      <div>
        <label for="confirmPassword" class="text-xs font-medium text-slate-300 mb-1.5 block">Confirmar contraseña</label>
        <input
          type="password"
          id="confirmPassword"
          autocomplete="new-password"
          placeholder="Repite tu nueva contraseña"
          class="w-full px-4 py-3 bg-slate-950/60 border border-slate-700/80 rounded-xl text-white placeholder-slate-500 focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 transition-all text-sm"
        >
        <p id="matchError" class="hidden text-xs text-rose-400 mt-1.5 flex items-center gap-1.5">🔴 Las contraseñas no coinciden</p>
        <p id="matchOk" class="hidden text-xs text-emerald-400 mt-1.5 flex items-center gap-1.5">🟢 Las contraseñas coinciden</p>
      </div>

      <div id="resetError" class="hidden p-3 bg-rose-500/10 border border-rose-500/20 rounded-xl">
        <p class="text-sm text-rose-300 text-center"></p>
      </div>

      <div id="resetSuccess" class="hidden p-3 bg-emerald-500/10 border border-emerald-400/20 rounded-xl">
        <p class="text-sm text-emerald-300 text-center"></p>
      </div>

      <button
        type="submit"
        id="btn-submit"
        disabled
        class="w-full mt-6 py-3 px-4 bg-emerald-600 hover:bg-emerald-500 disabled:opacity-40 disabled:cursor-not-allowed text-white font-semibold rounded-xl shadow-lg shadow-emerald-900/30 transition-all text-sm cursor-pointer"
      >
        Confirmar y Guardar
      </button>
    </form>
  </div>

  <script src="../js/api.js"></script>
  <script>
    (function () {
      var MIN_LENGTH = 6;

      function parseParams(str) {
        var out = {};
        String(str || '').replace(/^[#?]/, '').split('&').forEach(function (pair) {
          if (!pair) return;
          var idx = pair.indexOf('=');
          var k = decodeURIComponent(pair.slice(0, idx));
          var v = decodeURIComponent(pair.slice(idx + 1));
          out[k] = v;
        });
        return out;
      }

      function show(id, msg) {
        var box = document.getElementById(id);
        if (!box) return;
        box.classList.remove('hidden');
        if (msg) {
          var p = box.querySelector('p');
          if (p) p.textContent = msg;
        }
      }

      function hide(id) {
        var el = document.getElementById(id);
        if (el) el.classList.add('hidden');
      }

      // --- Enlace: token_hash (query) o access_token (hash) ---
      var query = parseParams(location.search);
      var hash = parseParams(location.hash);
      var tokenHash = query.token_hash || '';
      var accessToken = hash.access_token || '';
      var type = query.type || hash.type || '';
      var isRecovery = type === 'recovery';

      if (!isRecovery || (!tokenHash && !accessToken)) {
        var errDesc = query.error_description || hash.error_description;
        show('invalidBox', errDesc || 'El enlace es inválido o expiró. Solicitá uno nuevo desde el login.');
        return;
      }

      document.getElementById('resetForm').classList.remove('hidden');

      var newInput = document.getElementById('newPassword');
      var confirmInput = document.getElementById('confirmPassword');
      var btn = document.getElementById('btn-submit');
      var reqLength = document.getElementById('reqLength');

      function isLongEnough() { return newInput.value.length >= MIN_LENGTH; }
      function matches() { return confirmInput.value.length > 0 && confirmInput.value === newInput.value; }

      function renderValidation() {
        // Requisito de longitud
        var icon = reqLength.querySelector('.req-icon');
        if (isLongEnough()) {
          icon.textContent = '✓';
          reqLength.classList.remove('text-slate-500');
          reqLength.classList.add('text-emerald-400');
        } else {
          icon.textContent = '○';
          reqLength.classList.remove('text-emerald-400');
          reqLength.classList.add('text-slate-500');
        }

        // Coincidencia
        if (confirmInput.value.length === 0) {
          hide('matchError');
          hide('matchOk');
        } else if (matches()) {
          hide('matchError');
          show('matchOk');
        } else {
          hide('matchOk');
          show('matchError');
        }

        // Boton
        btn.disabled = !(isLongEnough() && matches());
      }

      newInput.addEventListener('input', renderValidation);
      confirmInput.addEventListener('input', renderValidation);
      renderValidation();

      document.getElementById('resetForm').addEventListener('submit', async function (e) {
        e.preventDefault();
        hide('resetError');

        if (!isLongEnough()) {
          show('resetError', 'La contraseña debe tener al menos ' + MIN_LENGTH + ' caracteres');
          return;
        }
        if (!matches()) {
          show('resetError', 'Las contraseñas no coinciden');
          return;
        }

        btn.disabled = true;
        var original = btn.textContent;
        btn.textContent = 'Guardando...';

        try {
          var payload = tokenHash
            ? { token_hash: tokenHash, type: 'recovery', password: newInput.value }
            : { access_token: accessToken, password: newInput.value };
          var res = await API.auth.resetPassword(payload);
          show('resetSuccess', (res.data && res.data.message) || 'Contraseña actualizada. Ya puedes iniciar sesión.');
          history.replaceState(null, '', location.pathname);
          setTimeout(function () { window.location.href = '/views/login.html'; }, 2500);
        } catch (err) {
          show('resetError', err.message || 'No se pudo actualizar la contraseña');
          btn.disabled = false;
          btn.textContent = original;
        }
      });
    })();
  </script>
</body>
</html>
